<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Synth — Meeting notes, on your terms</title>
  <desc id="desc">An original Synth illustration showing local voice processing connected to a central knowledge library.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#142444"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <path d="M640 0v420M840 0v420M1040 0v420M600 100h600M600 200h600M600 300h600" stroke="#253654" opacity=".4"/>
  <rect x="64" y="64" width="64" height="64" rx="18" fill="url(#blue)"/>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M81 91v10M91 82v28M101 76v40M111 86v20"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="64" y="207" fill="#f8fafc" font-size="68" font-weight="700" letter-spacing="-3">Synth</text>
    <text x="66" y="252" fill="#dbeafe" font-size="25">Meeting notes, on your terms.</text>
    <text x="66" y="296" fill="#94a3b8" font-size="17">Voice on your Mac. Knowledge across your team.</text>
    <rect x="66" y="329" width="108" height="29" rx="14" fill="#1e3a5f"/>
    <text x="120" y="349" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="700">OPEN SOURCE</text>
    <text x="192" y="349" fill="#94a3b8" font-size="13">LOCAL AUDIO · OWN CLOUD · WHITE LABEL</text>
    <rect x="674" y="80" width="420" height="112" rx="18" fill="#101d35" stroke="#35517b"/>
    <circle cx="708" cy="110" r="5" fill="#60a5fa"/>
    <text x="727" y="115" fill="#dbeafe" font-size="13" font-weight="700" letter-spacing="1">ON YOUR MAC</text>
    <g stroke="#60a5fa" stroke-width="6" stroke-linecap="round">
      <path d="M710 143v10M726 135v26M742 125v46M758 139v18M774 128v40M790 133v30M806 142v12M822 121v54M838 134v28M854 141v14M870 130v36M886 139v18"/>
    </g>
    <text x="918" y="146" fill="#f8fafc" font-size="15">Capture · Transcribe</text>
    <text x="918" y="168" fill="#94a3b8" font-size="12">Separate · Compare voices</text>
    <path d="M884 192v38" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="900" y="216" fill="#94a3b8" font-size="11">TEXT + SHARED CENTROIDS</text>
    <rect x="674" y="230" width="420" height="112" rx="18" fill="#101d35" stroke="#35517b"/>
    <circle cx="708" cy="260" r="5" fill="#93c5fd"/>
    <text x="727" y="265" fill="#dbeafe" font-size="13" font-weight="700" letter-spacing="1">YOUR CENTRAL LIBRARY</text>
    <rect x="702" y="285" width="109" height="30" rx="7" fill="#1e3354"/>
    <rect x="825" y="285" width="118" height="30" rx="7" fill="#1e3354"/>
    <rect x="957" y="285" width="109" height="30" rx="7" fill="#1e3354"/>
    <text x="756" y="305" text-anchor="middle" fill="#dbeafe" font-size="12">Notes &amp; sources</text>
    <text x="884" y="305" text-anchor="middle" fill="#dbeafe" font-size="12">Private folders</text>
    <text x="1011" y="305" text-anchor="middle" fill="#dbeafe" font-size="12">REST &amp; MCP</text>
  </g>
